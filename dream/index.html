<!doctype html>
<html lang="en">
<head>

<style>
@font-face{font-family:"IBM Plex Sans";font-weight:500;font-display:swap;src:url(../fonts/ibm-plex-sans-500.woff2) format("woff2")}
@font-face{font-family:"IBM Plex Mono";font-weight:400;font-display:swap;src:url(../fonts/ibm-plex-mono-400.woff2) format("woff2")}
:root{
  --bg:#07080d; --ink:#0b0d12;
  --glass:rgba(12,14,22,.38); --glass-strong:rgba(12,14,22,.56);
  --border:rgba(255,255,255,.10); --border-hi:rgba(255,196,120,.55);
  --text:#f3eee6; --dim:rgba(236,228,214,.60); --faint:rgba(236,228,214,.38);
  --accent:#e8a23a; --gold:#ffd08a; --sun:#ff8a3d; --rose:#ff5e7a; --violet:#b07cff; --sky:#7aa2ff;
  --grad:linear-gradient(100deg,#ffe2b0 0%,#f5b04a 30%,#ff7a4a 58%,#ff5e7a 78%,#b07cff 100%);
  --glow:rgba(232,162,58,.45);
  --mono:"IBM Plex Mono",ui-monospace,monospace; --sans:"IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas.stage{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- HUD ---------- */
#hud{position:fixed;z-index:3;top:max(12px,env(safe-area-inset-top));left:14px;right:14px;display:flex;justify-content:space-between;align-items:center;gap:8px;white-space:nowrap;font:400 11px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);pointer-events:none}
#hud .brand{display:flex;align-items:center;gap:9px}
#hud .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px 2px var(--glow);animation:breathe 3.2s ease-in-out infinite}
#hud b{font-weight:400;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#readout{color:var(--faint);font-variant-numeric:tabular-nums}
#hud .right{display:flex;gap:8px;align-items:center;pointer-events:auto}
.chip{appearance:none;background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%);border:1px solid var(--border);color:var(--dim);font:inherit;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border-radius:999px;text-decoration:none;cursor:pointer;transition:color .2s,border-color .2s,background .2s,box-shadow .2s}
.chip:hover,.chip:focus-visible{color:var(--text);border-color:rgba(255,255,255,.22);outline:none}
.chip.accent{color:var(--gold);border-color:rgba(232,162,58,.45)}
.chip.accent:hover,.chip.accent:focus-visible{background:var(--accent);color:#1a1006;box-shadow:0 0 22px -4px var(--glow)}
.chip[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.exps{display:flex;padding:2px;gap:2px;border-radius:999px;background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%);border:1px solid var(--border)}
.exps a{color:var(--dim);text-decoration:none;padding:3px 10px;line-height:1.4;border-radius:999px;transition:color .2s,background .2s}
.exps a:hover,.exps a:focus-visible{color:var(--text);background:rgba(255,255,255,.06);outline:none}
.exps a[aria-current="page"]{color:#1a1006;background:var(--grad);box-shadow:0 0 18px -4px var(--glow)}

/* ---------- bottom bar ---------- */
#bar{position:fixed;z-index:3;left:14px;right:14px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:flex-end;gap:12px;pointer-events:none}
#note{font:400 10.5px/1.6 var(--mono);letter-spacing:.14em;color:var(--faint);text-transform:uppercase;max-width:62ch;text-shadow:0 1px 8px rgba(0,0,0,.6)}
#bar .tools{display:flex;gap:8px;pointer-events:auto;flex-shrink:0}

#nogl{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:30px;text-align:center;font:400 13px/1.7 var(--mono);color:var(--dim)}
#nogl a{color:var(--gold)}
[hidden]{display:none!important}
@keyframes breathe{0%,100%{opacity:.55;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}
@media (prefers-reduced-motion:reduce){#hud .dot{animation:none}}

/* ---------- small screens (mirrors the live site's breakpoints) ---------- */
@media (min-width:521px){#hud .short{display:none}}
@media (max-width:520px){#readout,#hud .long{display:none}#note{font-size:9px}}
@media (max-width:560px){#hud .right{flex-wrap:wrap;justify-content:flex-end;row-gap:8px;width:100%}.exps{width:100%}.exps a{flex:1;text-align:center;padding:4px 0;letter-spacing:.03em}#bar{flex-direction:column;align-items:stretch}#bar .tools{justify-content:flex-end}}
@media (min-width:561px) and (max-width:1000px){#hud .brand{display:none}.exps a{padding:3px 7px;letter-spacing:.08em}}
</style>

<body>
<canvas id="gl" class="stage" aria-label="Dream landscape. Tilt to steer, drag to look, tap to release a lantern."></canvas>
<div id="hud">
  <span class="brand"><span class="dot"></span><span class="long">RUSSELL MERRICK / <b>DREAM</b></span></span>
  <span id="readout">HDG 000° · ALT 0</span>
  <span class="right">
    <nav class="exps" aria-label="Experiences"><a href="../">BASS</a><a href="../garden/">GARDEN</a><a href="./" aria-current="page">DREAM</a><a href="../nebula/">NEBULA</a></nav>
    <button id="recenter" class="chip" title="Make the current angle level"><span class="long">RECENTER</span><span class="short">⟲</span></button>
    <a class="chip accent" href="https://russellmerrick.com/about/"><span class="long">ENTER SITE →</span><span class="short">SITE →</span></a>
  </span>
</div>
<div id="bar">
  <span id="note">TILT = STEER &amp; CLIMB · DRAG = LOOK · TAP = LANTERN · HOLD = DRIFT FASTER</span>
  <span class="tools"><button id="sound" class="chip" aria-pressed="true" title="Ambient sound on/off">SOUND</button></span>
</div>
<div id="nogl" hidden>This one needs WebGL, which this browser has turned off. Try the <a href="../garden/">sand garden</a> or <a href="https://russellmerrick.com/about/">enter the site</a>.</div>
<script>
"use strict";
// ================= config =================
const FOV = 62, SPEED = 5.5, BOOST = 3.2, TURN = 34, CLIMB = 9;   // deg, units/s, x, deg/s at full tilt, units/s
const DEAD = 3, FULL = 30;                                          // tilt deadzone / full scale (deg)
const GRID_N = 120, GRID_HALF = 125, GRID_AHEAD = 100;              // terrain mesh: cells, half size, forward offset
const FOG_END = 112, WATER = 2.0, FORMS = 22, MAX_LANTERNS = 14;
const DPR_CAP = 2;
const D2R = Math.PI / 180, R2D = 180 / Math.PI, TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const params = new URLSearchParams(location.search);
const coarse = matchMedia("(pointer:coarse)").matches;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const DBG = params.get("dbg") || "";   // debug: b = no bloom, r = no rays, m = no mist
const MOTES = coarse ? 450 : 900, MOTE_BOX = 46, MAX_SPARKS = 2600, MAX_LIGHTS = 8;

// ================= terrain function (mirrors the GLSL exactly, used for flight height + spawning) =================
const fract = x => x - Math.floor(x);
function hash2(x, y) {
  let a = fract(x * 0.1031), b = fract(y * 0.1031), c = fract(x * 0.1031);
  const d = a * (b + 33.33) + b * (c + 33.33) + c * (a + 33.33);
  a += d; b += d; c += d;
  return fract((a + b) * c);
}
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(hash2(ix, iy), hash2(ix + 1, iy), ux), lerp(hash2(ix, iy + 1), hash2(ix + 1, iy + 1), ux), uy);
}
function terrain(x, y) {
  let h = 0, a = 1, qx = x * 0.018, qy = y * 0.018;
  for (let k = 0; k < 4; k++) { h += a * vnoise(qx, qy); const nx = qx * 2.03 + 17.1, ny = qy * 2.03 + 9.2; qx = nx; qy = ny; a *= 0.5; }
  h /= 1.875;
  return Math.pow(h, 1.6) * 34 - 3;
}

// ================= GLSL =================
const W_ = WATER.toFixed(2);
const GLSL_COMMON = `
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = p - i; vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y); }
uniform vec3 uSun; uniform float uTime; uniform float uWarm; uniform float uPulse; uniform float uEnc;
// thin-film / iridescent palette
vec3 film(float t){ return 0.5 + 0.5 * cos(6.28318 * (t + vec3(0.0, 0.33, 0.67))); }
vec2 ring2(float a, float r){ return vec2(cos(a), sin(a)) * r; }
// the dream sky: deep navy zenith -> violet -> amber/rose horizon, haze below the horizon
vec3 haze(vec3 d){
  float y = d.y;
  vec3 zen = vec3(0.018, 0.022, 0.07), mid = vec3(0.17, 0.085, 0.27);
  vec3 hor = mix(vec3(1.0, 0.52, 0.25), vec3(0.98, 0.37, 0.43), uWarm);
  vec3 low = vec3(0.13, 0.075, 0.17);
  vec3 c = mix(hor, mid, smoothstep(0.0, 0.24, y));
  c = mix(c, zen, smoothstep(0.2, 0.8, y));
  c = mix(c, mix(hor * 0.92, low, smoothstep(0.0, 0.35, -y)), step(y, 0.0));
  float s = max(dot(d, uSun), 0.0);
  c += vec3(1.0, 0.46, 0.2) * (pow(s, 6.0) * 0.26 + pow(s, 40.0) * 0.55 + pow(s, 600.0) * 1.6) * (1.0 + uPulse);
  c += vec3(0.9, 0.35, 0.6) * uPulse * 0.25 * (1.0 - abs(y));
  return c;
}
// aurora curtains (seamless in azimuth), strongest away from the sun
vec3 aurora(vec3 d){
  float y = d.y; if (y < 0.03) return vec3(0.0);
  float az = atan(d.x, -d.z);
  vec3 acc = vec3(0.0);
  for (int i = 0; i < 3; i++) {
    float fi = float(i);
    float base = 0.17 + fi * 0.085 + 0.08 * (vnoise(ring2(az, 2.1) + vec2(fi * 7.1, uTime * 0.02)) - 0.5) + 0.03 * sin(az * 3.0 + uTime * 0.035 + fi * 2.0);
    float e = y - base;
    float curtain = smoothstep(-0.018, 0.006, e) * exp(-max(e, 0.0) * (6.0 + fi * 3.5));
    float rays = 0.3 + 0.7 * vnoise(ring2(az, 36.0 + fi * 11.0) + vec2(uTime * 0.11, fi * 3.3));
    float pres = smoothstep(0.32, 0.78, vnoise(ring2(az, 1.7) + vec2(fi * 4.0 + uTime * 0.012, 2.0)));
    vec3 col = mix(vec3(0.16, 0.95, 0.70), vec3(0.85, 0.30, 1.0), clamp(e * 4.5 + fi * 0.33, 0.0, 1.0));
    acc += col * curtain * rays * pres * (0.62 - fi * 0.15);
  }
  vec2 dh = normalize(vec2(d.x, d.z) + 1e-5), sh = normalize(vec2(uSun.x, uSun.z) + 1e-5);
  float away = 1.0 - smoothstep(-0.2, 0.85, dot(dh, sh));
  return acc * smoothstep(0.03, 0.14, y) * (0.18 + 0.82 * away);
}`;

const VS_SKY = `attribute vec2 aPos; varying vec2 vUv; void main(){ vUv = aPos; gl_Position = vec4(aPos, 1.0, 1.0); }`;
const FS_SKY = (hp) => `precision ${hp} float;
varying vec2 vUv; uniform vec3 uR, uU, uF; uniform vec2 uTan; uniform vec3 uPlanet;
${GLSL_COMMON}
float hash3(vec3 p){ return hash(p.xy + p.z * 17.13); }
void main(){
  vec3 d = normalize(uF + vUv.x * uTan.x * uR + vUv.y * uTan.y * uU);
  vec3 c = haze(d);
  float y = d.y;
  // stars
  if (y > 0.02) {
    vec3 sp = d * 150.0; vec3 cell = floor(sp); float h = hash3(cell);
    if (h > 0.88) {
      vec3 o = fract(sp) - 0.5 - (vec3(hash3(cell + 3.1), hash3(cell + 7.7), hash3(cell + 1.3)) - 0.5) * 0.5;
      float tw = 0.55 + 0.45 * sin(uTime * (1.0 + h * 4.0) + h * 60.0);
      vec3 sc = mix(vec3(1.0, 0.86, 0.72), vec3(0.72, 0.84, 1.0), hash3(cell + 5.5));
      c += sc * smoothstep(0.17, 0.0, length(o)) * smoothstep(0.03, 0.4, y) * tw * (h - 0.88) * 20.0;
    }
  }
  c += aurora(d);
  // retro striped sun (HDR, so it blooms and casts rays)
  float R = 0.1; float r = length(d - uSun);
  if (r < R * 1.03) {
    float v = (d.y - uSun.y) / R;
    vec3 sc = mix(vec3(1.0, 0.24, 0.42), vec3(1.0, 0.8, 0.42), smoothstep(-1.0, 0.85, v)) * 2.1;
    float cut = v < 0.0 ? step(fract(-v * 4.5 + uTime * 0.05), clamp(-v * 0.75, 0.0, 0.6)) : 0.0;
    c = mix(c, sc, smoothstep(R, R * 0.965, r) * (1.0 - cut));
  }
  // pale ringed planet hanging opposite the sun, lit from behind
  vec3 P = uPlanet, pr_ = normalize(cross(P, vec3(0.0, 1.0, 0.0))), pu = cross(pr_, P);
  float dp = dot(d, P);
  if (dp > 0.85) {
    vec2 q = vec2(dot(d, pr_), dot(d, pu)) / dp;
    float PR = 0.12, rr = length(q) / PR;
    float ta = 0.38; vec2 rq = vec2(q.x * cos(ta) + q.y * sin(ta), -q.x * sin(ta) + q.y * cos(ta));
    float re = length(vec2(rq.x, rq.y * 4.0)) / PR;
    float ringA = smoothstep(1.36, 1.42, re) * smoothstep(2.05, 1.96, re) * (0.6 + 0.4 * sin(re * 38.0)) * (1.0 - 0.8 * smoothstep(1.62, 1.65, re) * smoothstep(1.74, 1.71, re));
    vec3 ringCol = mix(vec3(0.85, 0.6, 0.55), vec3(1.0, 0.86, 0.66), 0.5 + 0.5 * sin(re * 21.0)) * 0.95;
    bool front = rq.y < 0.0;
    if (!front) c = mix(c, ringCol, ringA * 0.7);
    if (rr < 1.0) {
      vec3 n = vec3(q / PR, sqrt(1.0 - rr * rr));
      vec3 L = normalize(vec3(dot(uSun, pr_), dot(uSun, pu), -dot(uSun, P)));
      float lit = dot(n, L);
      float bands = 0.5 + 0.5 * sin(n.y * 21.0 + vnoise(n.xy * 5.0 + uTime * 0.01) * 2.5);
      vec3 pc = mix(vec3(0.16, 0.12, 0.28), mix(vec3(0.96, 0.72, 0.60), vec3(0.82, 0.52, 0.66), bands), smoothstep(-0.25, 0.7, lit));
      pc += vec3(0.65, 0.42, 1.0) * pow(1.0 - n.z, 3.0) * 0.7;
      c = mix(c, pc, smoothstep(1.0, 0.97, rr));
    } else {
      c += vec3(0.55, 0.38, 0.9) * exp(-(rr - 1.0) * 7.0) * 0.16;
    }
    if (front) c = mix(c, ringCol, ringA * 0.85);
  }
  // drifting cloud banks lit from below by the sun, with silver linings
  float az = atan(d.x, -d.z) + uTime * 0.0035;
  float cl = vnoise(ring2(az, 3.3) + vec2(y * 15.0, 0.0)) * 0.55 + vnoise(ring2(az, 7.4) + vec2(y * 32.0, 3.0)) * 0.3 + vnoise(ring2(az, 16.0) + vec2(y * 62.0, 9.0)) * 0.15;
  cl = smoothstep(0.5, 0.84, cl) * smoothstep(0.012, 0.05, y) * smoothstep(0.34, 0.1, y);
  float sd = max(dot(d, uSun), 0.0);
  vec3 cloudCol = mix(vec3(0.28, 0.15, 0.32), vec3(1.0, 0.58, 0.42), pow(sd, 3.0)) + vec3(1.0, 0.62, 0.35) * pow(sd, 14.0) * 1.3;
  c = mix(c, cloudCol, cl * 0.66);
  // the odd shooting star
  for (int k = 0; k < 2; k++) {
    float fk = float(k);
    float T = uTime * 0.16 + fk * 0.53, cell = floor(T), ph = fract(T);
    float h1 = hash(vec2(cell, 3.0 + fk)), h2 = hash(vec2(cell * 1.7, 11.0 + fk)), h3 = hash(vec2(cell * 0.3, 5.0 + fk));
    if (h1 > 0.3 && ph < 0.22) {
      float az0 = h2 * 6.2832, el0 = 0.25 + h3 * 0.4;
      vec3 s0 = vec3(sin(az0) * cos(el0), sin(el0), -cos(az0) * cos(el0));
      if (dot(d, s0) > 0.85) {
        vec3 side = normalize(cross(s0, vec3(0.0, 1.0, 0.0)));
        vec3 tang = side * (h1 > 0.65 ? 1.0 : -1.0) - vec3(0.0, 0.5, 0.0);
        tang = normalize(tang - s0 * dot(tang, s0)); vec3 bin = cross(s0, tang);
        float p = ph / 0.22, u = dot(d, tang), v = dot(d, bin);
        float head = p * 0.42, tail = head - 0.16;
        float along = clamp((u - tail) / (head - tail), 0.0, 1.0);
        float s = step(tail, u) * step(u, head) * smoothstep(0.0012 + 0.0014 * along, 0.0, abs(v)) * along * along;
        c += vec3(1.0, 0.9, 0.78) * s * 3.5 * sin(p * 3.14159);
      }
    }
  }
  gl_FragColor = vec4(c * uEnc, 0.0);
}`;

const VS_TER = `precision highp float;
attribute vec2 aGrid; uniform vec2 uCenter; uniform float uSize; uniform mat4 uVP;
varying vec3 vWorld; varying vec3 vN; varying float vDepth;
float hash(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vnoise(vec2 p){ vec2 i = floor(p), f = p - i; vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), u.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x), u.y); }
float terrain(vec2 p){ float h = 0.0, a = 1.0; vec2 q = p * 0.018;
  for (int k = 0; k < 4; k++) { h += a * vnoise(q); q = q * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  h /= 1.875; return pow(h, 1.6) * 34.0 - 3.0; }
void main(){
  vec2 wp = uCenter + (aGrid - 0.5) * uSize;
  float h = terrain(wp), e = 1.2;
  vN = normalize(vec3(h - terrain(wp + vec2(e, 0.0)), e, h - terrain(wp + vec2(0.0, e))));
  vDepth = ${W_} - h;
  vWorld = vec3(wp.x, max(h, ${W_}), wp.y);
  gl_Position = uVP * vec4(vWorld, 1.0);
}`;
const FS_TER = (hp, deriv) => `${deriv ? "#extension GL_OES_standard_derivatives : enable\n#define DERIV 1" : ""}
${hp === "highp" && !coarse ? "#define FRAG_H 1" : ""}
precision ${hp} float;
varying vec3 vWorld; varying vec3 vN; varying float vDepth; uniform vec3 uCam; uniform vec4 uLan[${MAX_LIGHTS}]; uniform vec4 uWave; uniform float uMist;
${GLSL_COMMON}
#ifdef FRAG_H
float terrainF(vec2 p){ float h = 0.0, a = 1.0; vec2 q = p * 0.018;
  for (int k = 0; k < 4; k++) { h += a * vnoise(q); q = q * 2.03 + vec2(17.1, 9.2); a *= 0.5; }
  h /= 1.875; return pow(h, 1.6) * 34.0 - 3.0; }
#endif
vec3 lights(vec3 p, vec3 n, float water){
  vec3 acc = vec3(0.0);
  for (int i = 0; i < ${MAX_LIGHTS}; i++) {
    vec4 l = uLan[i]; if (l.w <= 0.0) continue;
    vec3 L = l.xyz - p; float d2 = dot(L, L);
    float dif = max(dot(n, L * inversesqrt(d2 + 1e-4)), 0.0);
    float pool = water * exp(-dot(L.xz, L.xz) / (1.2 + L.y * 0.8)) / (1.0 + L.y * 0.25);
    acc += vec3(1.0, 0.56, 0.24) * l.w * (dif * 9.0 / (d2 + 3.0) + pool * 1.3);
  }
  return acc;
}
void main(){
  vec3 V = vWorld - uCam; float dist = length(V); vec3 vd = V / dist;
  vec3 c; float refl = 0.0;

  au.lp.frequency.setTargetAtTime(650 + boost * 900 + (cam.y - WATER) * 8 + pulse * 600, t, 0.3);
}
document.addEventListener("visibilitychange", () => { if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume(); });

// ================= first gesture unlocks audio + asks for motion (iOS) =================
let unlocked = false, motionListening = false;
function listenMotion() {
  if (motionListening) return; motionListening = true;
  addEventListener("deviceorientation", onOrient);
}
function unlock() {
  if (unlocked) return; unlocked = true;
  try { if (navigator.audioSession) navigator.audioSession.type = "playback"; } catch (_) {}
  if (!ac) buildAudio(); if (ac) ac.resume();
  const DOE = window.DeviceOrientationEvent;
  const done = () => {
    started = true;
    setTimeout(() => { if (!haveSensor) document.getElementById("note").textContent = "MOUSE / ARROWS = STEER & CLIMB · DRAG = LOOK · CLICK = LANTERN · HOLD OR SPACE = FASTER"; }, 800);
  };
  if (DOE && typeof DOE.requestPermission === "function") {
    DOE.requestPermission().then(r => { if (r === "granted") listenMotion(); done(); })
      .catch(() => { done(); });
  } else { listenMotion(); done(); }
}
addEventListener("pointerdown", unlock, true);
addEventListener("touchstart", unlock, true);
addEventListener("keydown", e => { if (!e.repeat) unlock(); }, true);
// non-iOS: tilt works as soon as the sensor reports, no tap needed
if (!(window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === "function")) listenMotion();

// ================= boot =================
let glLost = false;
cv.addEventListener("webglcontextlost", e => { e.preventDefault(); glLost = true; RT = null; });
cv.addEventListener("webglcontextrestored", () => { initGL(); glLost = false; });
let glOK = !!gl;
if (glOK) { try { initGL(); } catch (err) { console.error(err); glOK = false; } }
if (!glOK) { document.getElementById("nogl").hidden = false; }
else {
  resize();
  // start somewhere with an open view ahead (a lake or low valley toward the sun)
  let bestX = 0, bestH = 1e9;
  for (let x = -600; x <= 600; x += 15) { let m = -1e9; for (let z = 0; z <= 70; z += 7) m = Math.max(m, terrain(x, -z)); if (m < bestH) { bestH = m; bestX = x; } }
  cam.x = bestX; cam.y = Math.max(terrain(cam.x, 0), WATER) + cam.altOff + 4;
  for (const o of forms) spawnForm(o, true);
  // a few lanterns already aloft so the first view glows
  for (let i = 0; i < 5; i++) { releaseLantern(rayFrom(cssW * (0.2 + 0.6 * Math.random()), cssH * (0.35 + 0.3 * Math.random())), false); const l = lanterns[lanterns.length - 1]; l.age = 1 + i * 2.5; l.y += i * 2; l.z -= i * 6; }
  SK.n = 0;
  requestAnimationFrame(t => { lastT = t; requestAnimationFrame(frame); });
}
// tiny hook for automated tests and tinkering in the console
window.dream = { stats: () => ({ w: cv.width, h: cv.height, scale, cam: { ...cam }, tiltX, tiltY, forms: forms.length, lanterns: lanterns.length, sparks: SK.n, deriv, hp, halfFloat: ENC === 1 }), tap: tapAt,
  bloomNearest: () => { const f = forms.filter(o => o.age > 2).sort((a, b) => a.dist - b.dist).find(o => o.dist > 15 && o.dist < 80 && dot(norm([o.x - cam.x, o.y - cam.y, o.z - cam.z]), basis.F) > 0.5); if (f) { f.bloom = 1; pulse = 1; flash = 0.12; flower(f); wave = { x: f.x, z: f.z, r: 0, k: 1.3 }; } return !!f; },
  boost: on => { boostHeld = !!on; }, turn: a => { cam.yaw += a; },
  lantern: (d, x, y) => { const r = rayFrom(cssW * x, cssH * y), l = { x: cam.x + r[0] * d, y: cam.y + r[1] * d, z: cam.z + r[2] * d, vx: Math.sin(cam.yaw) * cam.speed, vz: -Math.cos(cam.yaw) * cam.speed, age: 2, life: 26, seed: Math.random() }; lanterns.push(l); return lanterns.length; }, look: (y, p) => { lookYaw = y; lookPitch = p; }, warp: t => { for (let i = 0; i < t * 30; i++) step(1 / 30); },
  bench: n => { const t = performance.now(); for (let i = 0; i < n; i++) { step(1 / 60); render(); } gl.finish(); return (performance.now() - t) / n; } };
</script>
